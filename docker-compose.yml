services:
  food-sessions:
    build: .
    image: food-spend-optimizer:latest
    container_name: food-sessions
    ports:
      - "7749:3000"
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      # Container timezone — drives "today" and the notification hour gate.
      # Without this the container is UTC (~5h45m behind Nepal).
      TZ: Asia/Kathmandu
    restart: unless-stopped
